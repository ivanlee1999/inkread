name: Article annotation verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-annotations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow
            size: 320x900
            density: 160
          - name: phone
            size: 400x1000
            density: 160
          - name: fractional-phone
            size: 1080x2400
            density: 420
          - name: compact-tablet
            size: 800x1100
            density: 160
          - name: tablet
            size: 1000x1200
            density: 160
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare offline native annotation checks
        run: |
          cat > "$RUNNER_TEMP/annotation-avd-resolution.py" <<'PYTHON'
          import os, pathlib
          config = pathlib.Path(os.environ["ANDROID_AVD_HOME"]) / "article-annotations.avd/config.ini"
          width, height = "${{ matrix.size }}".split("x")
          dimensions = {"hw.lcd.width": width, "hw.lcd.height": height}
          lines = [line for line in config.read_text().splitlines()
                   if line.partition("=")[0].strip() not in dimensions]
          config.write_text("\n".join(lines + [f"{key}={value}" for key, value in dimensions.items()]) + "\n")
          PYTHON
          cat > "$RUNNER_TEMP/article-annotations-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell wm size ${{ matrix.size }}
          adb shell wm density ${{ matrix.density }}
          adb shell settings put system font_scale 1.0
          if adb shell pm path com.google.android.apps.nexuslauncher | grep -q '^package:'; then
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell pm list packages -d | tr -d '\r' | grep -qx 'package:com.google.android.apps.nexuslauncher'
          fi
          mkdir -p article-annotations-evidence
          # These are synthetic offline fixtures in a disposable AVD, never a user device.
          # Prevent AndroidApp's normal background startup checks from reaching real feeds.
          adb shell svc wifi disable
          adb shell svc data disable
          offline=0
          for attempt in $(seq 1 20); do
            adb shell dumpsys connectivity > article-annotations-evidence/connectivity.txt
            if grep -q 'Active default network: none' article-annotations-evidence/connectivity.txt; then offline=1; break; fi
            sleep 1
          done
          if [ "$offline" -ne 1 ]; then echo 'Annotation fixtures require an offline AVD' >&2; exit 1; fi
          git rev-parse HEAD > article-annotations-evidence/source-sha.txt
          if [ "${{ matrix.name }}" = phone ]; then
            # Reproduce the specific released touch-overlay defect with the same
            # real long-press test. This expected failure is isolated from all
            # corrected-head matrix results and must match the exact diagnostic.
            baseline=article-annotations-evidence/released-reader-baseline
            mkdir -p "$baseline"
            source=app/src/main/java/me/ash/reader/ui/page/home/reading/EInkPaginatedContent.kt
            cp "$source" "$RUNNER_TEMP/current-eink-reader.kt"
            trap 'cp "$RUNNER_TEMP/current-eink-reader.kt" "$source"' EXIT
            git fetch --no-tags --depth=1 origin a09e07e185b635908d433b98602c2ac0a78fb804
            git show a09e07e185b635908d433b98602c2ac0a78fb804:"$source" > "$source"
            sha256sum "$source" > "$baseline/released-reader-source.sha256"
            baseline_exit=0
            ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=me.ash.reader.ui.page.home.reading.EInkReaderAnnotationUiTest#defaultLongPressShowsNativeAnnotationToolbar \
              > "$baseline/gradle.log" 2>&1 || baseline_exit=$?
            if [ -d app/build/outputs/androidTest-results ]; then
              cp -R app/build/outputs/androidTest-results "$baseline/"
            fi
            cp "$RUNNER_TEMP/current-eink-reader.kt" "$source"
            trap - EXIT
            git diff --exit-code -- "$source"
            python3 .github/scripts/verify-default-selection-baseline.py \
              "$baseline/androidTest-results" "$baseline_exit" > "$baseline/expected-failure.json"
          fi
          adb shell dumpsys webviewupdate > article-annotations-evidence/webview.txt
          adb shell wm size > article-annotations-evidence/size.txt
          adb shell wm density > article-annotations-evidence/density.txt
          actual_size=$(tr -d '\r' < article-annotations-evidence/size.txt | sed -n 's/^\(Physical\|Override\) size: //p' | tail -n 1)
          test "$actual_size" = "${{ matrix.size }}"
          result=0
          for scale in 1.0 1.6; do
            adb shell settings put system font_scale "$scale"
            export ANNOTATION_FONT_SCALE="$scale"
            classes=me.ash.reader.ui.page.home.reading.EInkReaderAnnotationUiTest,me.ash.reader.ui.page.annotation.AnnotationReaderUiTest,me.ash.reader.ui.page.settings.readwise.ReadwiseSettingsUiTest
            if [ "${{ matrix.name }}" = phone ] && [ "$scale" = 1.0 ]; then
              classes="$classes,me.ash.reader.infrastructure.annotation.AnnotationRoomPersistenceTest,me.ash.reader.infrastructure.readwise.ReadwiseCredentialStoreTest"
            fi
            phase="article-annotations-evidence/font-$scale"
            mkdir -p "$phase"
            ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class="$classes" \
              -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir="/sdcard/Android/media/me.ash.reader/annotations-$scale" || result=1
            for output in app/build/outputs/connected_android_test_additional_output app/build/outputs/androidTest-results app/build/reports/androidTests; do
              if [ -d "$output" ]; then cp -R "$output" "$phase/"; fi
            done
            python3 - <<'PYTHON' || result=1
          import os, pathlib, struct, xml.etree.ElementTree as ET
          root = pathlib.Path("article-annotations-evidence") / ("font-" + os.environ["ANNOTATION_FONT_SCALE"])
          reports = list((root / "androidTest-results").rglob("TEST-*.xml"))
          assert reports, "No annotation instrumentation results"
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in totals: totals[key] += int(suite.get(key, 0))
          expected = 25 if "${{ matrix.name }}" == "phone" and os.environ["ANNOTATION_FONT_SCALE"] == "1.0" else 19
          assert totals == dict(tests=expected, failures=0, errors=0, skipped=0), totals
          for name in ("native-selection", "native-adjusted-selection", "rendered-highlight", "note-editor", "readwise-settings"):
              images = list(root.rglob(f"newspaper-annotation-{name}-*.png"))
              assert len(images) == 1, f"Missing/duplicate native annotation capture: {name}"
              data = images[0].read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n" and len(data) > 100
              assert struct.unpack(">II", data[16:24]) == tuple(map(int, "${{ matrix.size }}".split("x")))
          PYTHON
          done
          adb logcat -d > article-annotations-evidence/logcat.txt
          exit "$result"
          SCRIPT
      - name: Verify local annotation and export UI on a native AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: article-annotations
          pre-emulator-launch-script: python3 "$RUNNER_TEMP/annotation-avd-resolution.py"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/article-annotations-tests.sh"
      - name: Upload native annotation evidence and generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-annotations-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            article-annotations-evidence/**
            app/schemas/me.ash.reader.infrastructure.annotation.AnnotationsDatabase/**
          if-no-files-found: error
