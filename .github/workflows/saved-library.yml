name: Saved library verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saved-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-library:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow
            size: 320x900
            density: 160
          - name: phone
            size: 400x1000
            density: 160
          - name: fractional-phone
            size: 1080x2400
            density: 420
          - name: compact-tablet
            size: 800x1100
            density: 160
          - name: tablet
            size: 1000x1200
            density: 160
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare native Saved checks
        run: |
          cat > "$RUNNER_TEMP/saved-avd-resolution.py" <<'PYTHON'
          import os, pathlib
          config = pathlib.Path(os.environ["ANDROID_AVD_HOME"]) / "saved-library.avd/config.ini"
          width, height = "${{ matrix.size }}".split("x")
          dimensions = {"hw.lcd.width": width, "hw.lcd.height": height}
          lines = [line for line in config.read_text().splitlines()
                   if line.partition("=")[0].strip() not in dimensions]
          config.write_text("\n".join(lines + [f"{key}={value}" for key, value in dimensions.items()]) + "\n")
          PYTHON
          cat > "$RUNNER_TEMP/saved-library-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell wm size ${{ matrix.size }}
          adb shell wm density ${{ matrix.density }}
          adb shell settings put system font_scale 1.0
          if adb shell pm path com.google.android.apps.nexuslauncher | grep -q '^package:'; then
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell pm list packages -d | tr -d '\r' | grep -qx 'package:com.google.android.apps.nexuslauncher'
          fi
          mkdir -p saved-library-evidence
          # These are synthetic offline fixtures in a disposable AVD, never a user device.
          # Prevent AndroidApp's normal background startup checks from reaching real feeds.
          adb shell svc wifi disable
          adb shell svc data disable
          offline=0
          for attempt in $(seq 1 20); do
            adb shell dumpsys connectivity > saved-library-evidence/connectivity.txt
            if grep -q 'Active default network: none' saved-library-evidence/connectivity.txt; then offline=1; break; fi
            sleep 1
          done
          if [ "$offline" -ne 1 ]; then echo 'Saved fixtures require an offline AVD' >&2; exit 1; fi
          git rev-parse HEAD > saved-library-evidence/source-sha.txt
          adb shell dumpsys webviewupdate > saved-library-evidence/webview.txt
          adb shell wm size > saved-library-evidence/size.txt
          adb shell wm density > saved-library-evidence/density.txt
          actual_size=$(tr -d '\r' < saved-library-evidence/size.txt | sed -n 's/^\(Physical\|Override\) size: //p' | tail -n 1)
          test "$actual_size" = "${{ matrix.size }}"
          classes=me.ash.reader.ui.page.library.SavedLibraryNativeVisualTest
          if [ "${{ matrix.name }}" = phone ]; then
            classes="$classes,me.ash.reader.infrastructure.library.SavedLibraryRoomPersistenceTest,me.ash.reader.ui.page.library.SavedLibraryMainActivitySmokeTest"
          fi
          if [ "${{ matrix.name }}" = phone ] || [ "${{ matrix.name }}" = tablet ]; then
            classes="$classes,me.ash.reader.ui.page.home.reading.EInkReaderResumeUiTest"
          fi
          result=0
          ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class="$classes" \
            -Pandroid.testInstrumentationRunnerArguments.savedRouteSmokeFixture=true \
            -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir=/sdcard/Android/media/me.ash.reader/saved-library || result=$?
          for output in app/build/outputs/connected_android_test_additional_output app/build/outputs/androidTest-results app/build/reports/androidTests; do
            if [ -d "$output" ]; then cp -R "$output" saved-library-evidence/; fi
          done
          adb logcat -d > saved-library-evidence/logcat.txt
          python3 - <<'PYTHON' || result=1
          import json, pathlib, struct
          root = pathlib.Path("saved-library-evidence")
          reports = [json.loads(p.read_text()) for p in root.rglob("saved-library-page-*.geometry.json")]
          assert reports, "No production Saved page geometry reports"
          for scale in (1.0, 1.6):
              samples = [r for r in reports if abs(r["fontScale"] - scale) < .01]
              assert samples, f"Missing font-scale coverage: {scale}"
              assert all(r["schema"] == 1 and r["productionSurface"] == "SavedLibraryPage" for r in samples)
              assert all(abs(r["density"] - ${{ matrix.density }} / 160) < .01 for r in samples)
              assert any(r["page"] == 0 for r in samples)
              assert any(r["page"] == r["pageCount"]-1 for r in samples)
              assert all(r["sourceIds"] and r["viewportPx"][3] > r["viewportPx"][1] for r in samples)
          for label in (100, 160):
              for stem in (f"saved-library-page-", f"saved-library-item-actions-font-{label}", f"saved-library-shared-choices-font-{label}", f"saved-reader-font-{label}"):
                  matches = list(root.rglob(f"newspaper-{stem}*.png"))
                  assert matches, f"Missing native screenshot: {stem}"
                  for image in matches:
                      data = image.read_bytes()
                      assert data[:8] == b"\x89PNG\r\n\x1a\n" and len(data) > 100
                      assert struct.unpack(">II", data[16:24]) == tuple(map(int, "${{ matrix.size }}".split("x")))
          PYTHON
          if [ "${{ matrix.name }}" = phone ] || [ "${{ matrix.name }}" = tablet ]; then
            # Preserve app-private anchor state across two genuinely separate processes.
            mapfile -t app_apks < <(find app/build/outputs/apk/github/debug -maxdepth 1 -name '*.apk')
            mapfile -t test_apks < <(find app/build/outputs/apk/androidTest/github/debug -maxdepth 1 -name '*.apk')
            test "${#app_apks[@]}" -eq 1
            test "${#test_apks[@]}" -eq 1
            adb install -r "${app_apks[0]}"
            adb install -r "${test_apks[0]}"
            for phase in seed restore; do
              adb shell am force-stop me.ash.reader
              destination="saved-library-evidence/process-$phase"
              mkdir -p "$destination"
              adb shell am instrument -w -r \
                -e class me.ash.reader.ui.page.home.reading.EInkReaderResumeUiTest#freshProcessResume \
                -e savedResumePhase "$phase" \
                -e additionalTestOutputDir "/sdcard/Android/media/me.ash.reader/saved-resume-$phase" \
                me.ash.reader.test/androidx.test.runner.AndroidJUnitRunner | tee "$destination/instrumentation.txt"
              adb pull "/sdcard/Android/media/me.ash.reader/saved-resume-$phase" "$destination/native" || result=1
              if ! grep -Eq 'OK \(1 test\)' "$destination/instrumentation.txt"; then result=1; fi
              if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=' "$destination/instrumentation.txt"; then result=1; fi
            done
            python3 - <<'PYTHON' || result=1
          import json, pathlib
          root = pathlib.Path("saved-library-evidence")
          seed = list((root/"process-seed").rglob("reader-resume-seed.json"))
          restore = list((root/"process-restore").rglob("reader-resume-restore.json"))
          assert len(seed) == len(restore) == 1
          a,b = (json.loads(paths[0].read_text()) for paths in (seed,restore))
          assert a["pid"] != b["pid"], "Resume reused the same process"
          before = next(s for s in a["snapshots"] if s["label"] == "seed-position")
          after = next(s for s in b["snapshots"] if s["label"] == "fresh-process-restored")
          assert before["anchor"] == after["anchor"] and after["page"] > 0
          assert b["pageEvents"][0] > 1 and "restored" in b["restoreResults"]
          PYTHON
          fi
          exit "$result"
          SCRIPT
      - name: Verify production Saved pages on a native AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: saved-library
          pre-emulator-launch-script: python3 "$RUNNER_TEMP/saved-avd-resolution.py"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/saved-library-tests.sh"
      - name: Upload Saved screenshots, geometry, Room schema and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-library-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            saved-library-evidence/**
            app/schemas/me.ash.reader.infrastructure.library.SavedLibraryDatabase/**
          if-no-files-found: error
