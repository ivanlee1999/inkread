name: Newspaper UI verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newspaper-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow
            size: 320x900
            width: 320
          # Logical-dp fixtures at density 160, not physical BOOX device emulation.
          - name: phone
            size: 400x1000
            width: 400
          - name: compact-tablet
            size: 600x1100
            width: 600
          - name: wide
            size: 800x1100
            width: 800
          - name: broad-tablet
            size: 1000x1200
            width: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare native UI test and screenshot collection
        run: |
          cat > "$RUNNER_TEMP/newspaper-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell wm size ${{ matrix.size }}
          adb shell wm density 160
          # The google_apis image's Pixel Launcher can ANR and steal modal-window focus.
          # Disable only that launcher in this disposable AVD; keep app Back tests unchanged.
          if adb shell pm path com.google.android.apps.nexuslauncher | grep -q '^package:'; then
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell pm list packages -d | tr -d '\r' | grep -qx 'package:com.google.android.apps.nexuslauncher'
          fi
          result=0
          ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=me.ash.reader.ui.page.home.NewspaperUiTest,me.ash.reader.ui.page.home.ViewportNewspaperUiTest,me.ash.reader.ui.page.home.ViewportFolderUiTest \
            -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir=/sdcard/Android/media/me.ash.reader/newspaper-screenshots || result=$?
          # AGP copies additional test outputs to the host before removing the app.
          # Do not silently succeed if tests passed but screenshot delivery failed.
          python3 - <<'PYTHON'
          import pathlib
          import shutil
          import struct
          root = pathlib.Path("app/build/outputs/connected_android_test_additional_output")
          destination = pathlib.Path("newspaper-screenshots")
          destination.mkdir(exist_ok=True)
          width = ${{ matrix.width }}
          names = ("subscriptions", "subscriptions-gestures", "folders", "folders-collapsed", "articles-footer-insets", "articles", "articles-end", "articles-image-large-font", "articles-large-font-end", "photos-auto", "photos-phone", "photos-tablet", "photos-off", "photos-cached-offline", "editorial-templates", "photos-alternate", "photos-missing", "compact-count-closed", "compact-count-open", "compact-count-large-font", "compact-footerless-end", "viewport-cjk-first", "viewport-cjk-second", "viewport-cjk-last", "viewport-cjk-large-font", "viewport-delayed-photo", "viewport-failed-photo", "viewport-resized-anchor", "viewport-header-actions", "folders-first", "folders-last", "folders-expanded", "folders-large-font", "folders-rtl")
          extra = ("viewport-cjk-middle", "folders-middle", "density-append-locked", "density-long-excerpt", "density-sparse-story", "density-long-folder", "density-sparse-folder")
          mixed = tuple(f"density-mixed-{scale}-{images}-{page}" for scale in (100, 160, 200) for images in ("photos", "text") for page in ("first", "middle", "last"))
          folders = tuple(f"density-folders-{scale}-{page}" for scale in (100, 160, 200) for page in ("first", "middle", "last"))
          names += extra + mixed + folders
          density_names = {"viewport-cjk-first", "viewport-cjk-second", "viewport-cjk-middle", "viewport-cjk-last", "viewport-cjk-large-font", "viewport-delayed-photo", "viewport-failed-photo", "viewport-resized-anchor", "folders-first", "folders-middle", "folders-last", "folders-expanded", "folders-large-font", "folders-rtl"} | {name for name in names if name.startswith("density-")}
          for name in names:
              filename = f"newspaper-{name}-{width}.png"
              matches = list(root.rglob(filename))
              assert len(matches) == 1, f"Expected one {filename}, found {matches} in {root}"
              source = matches[0]
              data = source.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n" and len(data) > 100, f"Invalid PNG: {source}"
              image_width, image_height = struct.unpack(">II", data[16:24])
              assert image_width == width and image_height > 0, f"Unexpected screenshot dimensions: {source}: {image_width}x{image_height}"
              if name.startswith(("compact-", "viewport-", "density-")) or name in ("folders-first", "folders-middle", "folders-last", "folders-expanded", "folders-large-font", "folders-rtl"):
                  height = int("${{ matrix.size }}".split("x")[1])
                  assert image_height == height, f"Production paged screens must be captured at full native screen height: {source}: {image_width}x{image_height}"
              shutil.copy2(source, destination / filename)
              print(f"Collected {filename}: {image_width}x{image_height}, {len(data)} bytes")
              if name in density_names:
                  import json
                  reports = list(root.rglob(f"newspaper-{name}-{width}.density.json"))
                  assert len(reports) == 1, f"Expected density report for {filename}"
                  report = json.loads(reports[0].read_text())
                  assert report["schema"] == 1 and report["screenWidthDp"] == width
                  assert report["nativeScreenPx"] == [image_width, image_height]
                  assert 0 <= report["contentCoverage"] <= 1 and report["viewportAreaPx"] > 0
                  assert report["contentAreaPx"] <= report["viewportAreaPx"]
                  assert report["renderedTextLines"] > 0 and report["sourceIds"], f"Missing real content evidence: {filename}"
                  shutil.copy2(reports[0], destination / reports[0].name)
          PYTHON
          exit "$result"
          SCRIPT
      - name: Render and test real Compose layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/newspaper-tests.sh"
      - name: Upload screenshots and native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-ui-${{ matrix.name }}-${{ github.sha }}
          path: |
            newspaper-screenshots/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: error
