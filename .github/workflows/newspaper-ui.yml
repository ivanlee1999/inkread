name: Newspaper UI verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newspaper-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow
            size: 320x900
            width: 320
          # Logical-dp fixtures at density 160, not physical BOOX device emulation.
          - name: phone
            size: 400x1000
            width: 400
          - name: compact-tablet
            size: 600x1100
            width: 600
          - name: wide
            size: 800x1100
            width: 800
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare native UI test and screenshot collection
        run: |
          cat > "$RUNNER_TEMP/newspaper-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell wm size ${{ matrix.size }}
          adb shell wm density 160
          result=0
          ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=me.ash.reader.ui.page.home.NewspaperUiTest \
            -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir=/sdcard/Android/media/me.ash.reader/newspaper-screenshots || result=$?
          # AGP copies additional test outputs to the host before removing the app.
          # Do not silently succeed if tests passed but screenshot delivery failed.
          python3 - <<'PYTHON'
          import pathlib
          import shutil
          import struct
          root = pathlib.Path("app/build/outputs/connected_android_test_additional_output")
          destination = pathlib.Path("newspaper-screenshots")
          destination.mkdir(exist_ok=True)
          width = ${{ matrix.width }}
          names = ("subscriptions", "subscriptions-gestures", "folders", "folders-collapsed", "articles-footer-insets", "articles", "articles-end", "articles-image-large-font", "articles-large-font-end", "photos-auto", "photos-phone", "photos-tablet", "photos-off", "photos-cached-offline")
          for name in names:
              filename = f"newspaper-{name}-{width}.png"
              matches = list(root.rglob(filename))
              assert len(matches) == 1, f"Expected one {filename}, found {matches} in {root}"
              source = matches[0]
              data = source.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n" and len(data) > 100, f"Invalid PNG: {source}"
              image_width, image_height = struct.unpack(">II", data[16:24])
              assert image_width == width and image_height > 0, f"Unexpected screenshot dimensions: {source}: {image_width}x{image_height}"
              shutil.copy2(source, destination / filename)
              print(f"Collected {filename}: {image_width}x{image_height}, {len(data)} bytes")
          PYTHON
          exit "$result"
          SCRIPT
      - name: Render and test real Compose layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/newspaper-tests.sh"
      - name: Upload screenshots and native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-ui-${{ matrix.name }}-${{ github.sha }}
          path: |
            newspaper-screenshots/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: error
