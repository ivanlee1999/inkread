name: Newspaper UI verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newspaper-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow
            size: 320x900
            width: 320
          - name: wide
            size: 800x1100
            width: 800
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare native UI test and screenshot collection
        run: |
          cat > "$RUNNER_TEMP/newspaper-tests.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set +e
          adb shell wm size ${{ matrix.size }}
          adb shell wm density 160
          ./gradlew --no-daemon --max-workers=2 connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.ash.reader.ui.page.home.NewspaperUiTest
          result=$?
          mkdir -p newspaper-screenshots
          adb pull /sdcard/Android/data/me.ash.reader/files/newspaper-screenshots/. newspaper-screenshots/
          exit "$result"
          SCRIPT
      - name: Render and test real Compose layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/newspaper-tests.sh"
      - name: Upload screenshots and native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-ui-${{ matrix.name }}-${{ github.sha }}
          path: |
            newspaper-screenshots/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
