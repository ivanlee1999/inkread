name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: Publish this branch commit as an InkRead release
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate and build optimized APK
        run: ./gradlew --no-daemon --max-workers=2 testGithubDebugUnitTest lintGithubRelease assembleGithubRelease
      - name: Verify APK and write checksum
        run: |
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' -type f)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/github/release/*.sha256
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkread-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: ./apk
      - name: Publish verified branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$(date -u +%Y%m%d-%H%M)-${COMMIT}"
          cat > release-notes.md <<EOF_NOTES
          Built by GitHub Actions from commit ${{ github.sha }}.

          InkRead $VERSION adds independent Chinese and English font sizes in the article reader's live Text settings. Change either size while previewing the actual article; Apply saves both, Cancel restores the previous values, and Reset previews the defaults. Existing common-size preferences migrate without changing their appearance. Quick A controls adjust both scripts together while retaining their size difference within the supported range.

          Chinese/CJK characters and full-width punctuation use the Chinese size. English, ASCII numbers and punctuation retain the base size. Relative headings, selected fonts, line spacing and margins remain in effect; specialized code and math typography stays unchanged. System fallback fonts also respect the independent sizes. There is no new permanent bar or animation.

          One-time presentation runs retain original logical text coordinates. Existing reading positions, annotation fingerprints, exact quotes, links and text selection remain compatible across formatting changes. Highlight redraw avoids painting identical inline rectangles twice. The source-selection safeguards and full-content improvements from 0.16.19 remain included.

          Uses the existing application ID, signing identity and database schemas. Native phone/tablet and process-restart validation is required before publication; physical BOOX behavior remains unverified. This release does not include the separately prepared RSS action, resume-storage or page-key replacements, and does not change FreshRSS or account credentials.
          EOF_NOTES
          gh release create "$TAG" --target "${{ github.sha }}" --title "InkRead $VERSION ($COMMIT)" --notes-file release-notes.md ./apk/*.apk ./apk/*.sha256
