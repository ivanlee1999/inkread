name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: Publish this branch commit as an InkRead release
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate and build optimized APK
        run: ./gradlew --no-daemon --max-workers=2 testGithubDebugUnitTest lintGithubRelease assembleGithubRelease
      - name: Verify APK and write checksum
        run: |
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' -type f)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/github/release/*.sha256
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkread-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*
            app/schemas/me.ash.reader.infrastructure.db.AndroidDatabase/**
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: ./apk
      - name: Publish verified branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$(date -u +%Y%m%d-%H%M)-${COMMIT}"
          cat > release-notes.md <<EOF_NOTES
          Built by GitHub Actions from commit ${{ github.sha }}.

          InkRead $VERSION improves article extraction, newsletter feeds and explicit feed-source refresh. It keeps pinned Mozilla Readability 0.6.0 and the existing access/quality checks. Known lazy-image attributes now retain extensionless CDN URLs, older Latin-1/ASCII HTML labels preserve punctuation, and declared non-HTML responses cannot become saved articles.

          Newsletter mode accepts an existing direct RSS/Atom feed. It keeps the delivered body, disables automatic publisher extraction/browser opening and blocks remote media until an explicit image choice. Private newsletter feed URLs are omitted from OPML export and request diagnostics omit sensitive payloads. Removing a feed does not unsubscribe from email delivery. No mailbox, forwarding rule, signup or email service is created.

          FreshRSS/Google Reader articles have an explicit Refresh feed content action. It requests that existing server item without relying on new-item cursors, retains an exact earlier feed body before updating, and preserves article identity, read/star/later flags and annotations. Empty or less complete bodies are kept out; earlier feed, extracted and imported sources remain separate.

          Saved Library explains supported publisher restrictions, browser challenges and preparation limits and offers Open original page. Existing offline text and reading anchors survive failed retries. Publisher scripts are never executed, and subscription restrictions are not bypassed. A New Yorker-specific parsing fix is not claimed without a reproducible article example.

          Uses the existing application ID and signing identity, with an additive database migration for newsletter preferences. Synthetic unit, native parser, migration, source-history and reader checks gate publication. No production FreshRSS changes or third-party extraction service. Physical BOOX behavior remains unverified.
          EOF_NOTES
          gh release create "$TAG" --target "${{ github.sha }}" --title "InkRead $VERSION ($COMMIT)" --notes-file release-notes.md ./apk/*.apk ./apk/*.sha256
