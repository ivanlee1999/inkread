name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: Publish this branch commit as an InkRead release
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate and build optimized APK
        run: ./gradlew --no-daemon --max-workers=2 testGithubDebugUnitTest lintGithubRelease assembleGithubRelease
      - name: Verify APK and write checksum
        run: |
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' -type f)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/github/release/*.sha256
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkread-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: ./apk
      - name: Publish verified branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$(date -u +%Y%m%d-%H%M)-${COMMIT}"
          cat > release-notes.md <<EOF_NOTES
          Built by GitHub Actions from commit ${{ github.sha }}.

          InkRead $VERSION adds a lightweight annotation workflow to the paginated RSS and Saved readers. Tap an existing highlight to edit its note, resize its selected passage, or delete it locally. Resize preserves the annotation's identity and note; after restoring its range, tap the selected passage to reveal Android's handles, then choose Save highlight or Cancel.

          Saved > menu > Highlights and notes opens a searchable device-local notebook across articles. Search quote, note, title or source; filter notes or pending/problem exports; return to the exact passage when its source is still available. Quotes and notes remain readable after source removal. RSS passages require their original active account; notebook article routes use the paginated reader without changing the global reading preference.

          Automatic highlighting is optional and off by default in Settings > Annotations & Readwise. A completed selection can save one local highlight, with Undo in the native selection menu, reader controls or annotation list. Dragging handles does not repeatedly save. Automatic highlights wait briefly before optional export. Undo deletes locally and cannot recall a Readwise request already sent. Explicit Highlight and Add note remain available when automatic highlighting is off.

          Existing per-highlight export states are summarized in the on-demand reader controls; there is no new permanent footer or animation. Readwise export remains separately opt-in and one-way to the Readwise highlights library, not Reader document/library sync. Resizing can update the exported quote and note on the same remote highlight; it does not promise updated remote ordering or Reader passage anchors. Deleting locally leaves an already-exported copy. No real credentials or private account exports were used in validation.

          Uses the existing application ID, signing identity and database schemas. Legacy scrolling-reader annotations and physical BOOX testing are not included. Native Android validation is required before publication.
          EOF_NOTES
          gh release create "$TAG" --target "${{ github.sha }}" --title "InkRead $VERSION ($COMMIT)" --notes-file release-notes.md ./apk/*.apk ./apk/*.sha256
