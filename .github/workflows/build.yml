name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: Publish this branch commit as an InkRead release
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate and build optimized APK
        run: ./gradlew --no-daemon --max-workers=2 testGithubDebugUnitTest lintGithubRelease assembleGithubRelease
      - name: Verify APK and write checksum
        run: |
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' -type f)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/github/release/*.sha256
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkread-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inkread-release-${{ github.sha }}
          path: ./apk
      - name: Publish verified branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$(date -u +%Y%m%d-%H%M)-${COMMIT}"
          cat > release-notes.md <<EOF_NOTES
          Built by GitHub Actions from commit ${{ github.sha }}.

          InkRead $VERSION improves article extraction without replacing the current Readability4J engine. Usable feed/server content is retained when extraction fails or is clearly less complete. The Source control offers feed/server content, the available full article, or an explicit fresh fetch. A failed or worse refresh does not destroy a useful offline extraction.

          Full-text HTML now uses consistent bounded character decoding for RSS and Saved articles, including Chinese pages with HTML charset metadata. Relative images and links use the final redirected page URL and effective HTML base, preserving non-default ports and parent-directory references. Existing absolute proxy URLs are kept unchanged.

          Saved articles choose useful responsive image sizes and try a bounded set of alternatives when an image is unavailable or too large. Existing image/storage limits remain in force; text survives partial image failure, retained images remain usable offline, and retries skip assets already stored successfully.

          Source changes do not replace the visible body after selection, annotation capture/editing or formatting begins during a background fetch. Download/cache work can finish, and the Source dialog explains that new content is ready for a later explicit choice. Status-only refresh notices do not reset annotation drafts. The existing annotation notebook, highlight editing and separately opt-in Readwise export remain supported.

          Uses the existing application ID, signing identity and database schemas. This app release does not change FreshRSS server configuration, bypass login/paywalls or change the sanitizer. Native Android validation is required before publication; physical BOOX behavior remains unverified. No private article content, credentials or real Readwise exports are used in validation.
          EOF_NOTES
          gh release create "$TAG" --target "${{ github.sha }}" --title "InkRead $VERSION ($COMMIT)" --notes-file release-notes.md ./apk/*.apk ./apk/*.sha256
