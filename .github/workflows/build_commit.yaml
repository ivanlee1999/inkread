name: "Build Commit"
on: push

jobs:
    build:
        # Approved release/recovery tags already have a validated official APK.
        if: github.ref != 'refs/tags/v0.16.23' && github.ref != 'refs/tags/v0.16.23-publish-once'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3.3.0
            - uses: actions/setup-java@v3.10.0
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/gradle-build-action@v2.4.2
            - run: ./gradlew assembleGithubRelease

            - uses: actions/upload-artifact@v4
              with:
                  name: ReadYou-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/release/*.apk
